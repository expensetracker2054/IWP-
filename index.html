<style>
/* Built for the daily pass, not a demo. Opening page answers "what needs me
   today" and "where do I stand"; one tap down is the ledger with its workings.
   Palette and type from Burmese lacquerware and account books: teak, brass,
   jade, cinnabar; money set in a book serif, not a dashboard sans. */
:root{
  --bg:#ECE8DF; --sheet:#FAF8F3; --ink:#1F1D18; --muted:#7A7466; --rule:#D8D2C4;
  --earned:#92651A; --held:#2C6850; --spent:#9A4030; --brass:#B08A3E;
  --serif:"Newsreader",Georgia,"Noto Sans Myanmar","Myanmar Text","Myanmar Sangam MN","Songti SC",serif;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Noto Sans Myanmar","Myanmar Text","Myanmar Sangam MN","Pyidaungsu","Padauk","PingFang SC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15140F; --sheet:#1E1C17; --ink:#EDE8DC; --muted:#8C8576; --rule:#312E26;
  --earned:#D2A049; --held:#5FA384; --spent:#D1796A; --brass:#C9A05C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15140F; --sheet:#1E1C17; --ink:#EDE8DC; --muted:#8C8576; --rule:#312E26;
  --earned:#D2A049; --held:#5FA384; --spent:#D1796A; --brass:#C9A05C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;margin:0;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 84px}
.n{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.blurred .hide{filter:blur(9px);user-select:none}

header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:18px 10px;border-bottom:1px solid var(--rule)}
.back{background:none;border:none;color:var(--muted);font-size:17px;padding:4px 8px 4px 0;line-height:1;cursor:pointer}
.back:hover{color:var(--ink)}
.mark{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.14em;margin:0;flex:1;min-width:0}
.mark i{font-style:normal;color:var(--brass)}
.mark.page{letter-spacing:0;font-size:18px}
.ctl{display:flex;gap:6px;flex-wrap:wrap}
button,select,input{font-family:var(--sans)}
button,select{font-size:13px;cursor:pointer}
.chip{background:none;border:1px solid var(--rule);color:var(--muted);padding:6px 11px;border-radius:2px}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.chip{padding-right:26px;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

/* needs you today */
.todo{border:1px solid var(--rule);border-left:3px solid var(--spent);background:var(--sheet);margin-block:20px}
.todo.calm{border-left-color:var(--held)}
.todo h2{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  margin:0;padding:14px 16px 0}
.todoItem{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--rule);margin-top:10px}
.todoItem:first-of-type{margin-top:10px}
.todoItem .tl{flex:1;min-width:0}
.todoItem .tt{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todoItem .ts{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45}
.todoItem .ta{font-family:var(--serif);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto}
.todoItem .ta.late{color:var(--spent)} .todoItem .ta.soon{color:var(--earned)}
.todoGo{background:none;border:1px solid var(--rule);color:var(--muted);font-size:12px;padding:5px 10px;border-radius:2px;flex:0 0 auto}
.todoGo:hover{border-color:var(--ink);color:var(--ink)}
.allclear{padding:14px 16px 16px;color:var(--muted);font-size:13.5px}

/* position */
.pos{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-block:22px}
.cell{background:var(--bg);padding:15px 14px}
.cell .k{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cell .v{display:block;font-family:var(--serif);font-size:clamp(18px,4.2vw,23px);font-weight:600;
  font-variant-numeric:tabular-nums;margin-top:6px;line-height:1.15;letter-spacing:-.02em;
  overflow-wrap:anywhere}
.cell .s{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere}
.cell.wide{grid-column:1/-1;background:var(--sheet)}
.cell.wide .v{font-size:clamp(24px,6vw,32px)}

.statement{background:var(--sheet);border:1px solid var(--rule);padding:18px;margin-block:22px}
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding-block:8px;border-bottom:1px solid var(--rule)}
.srow:last-of-type{border-bottom:none}
.srow .k{color:var(--muted);font-size:13.5px}
.srow .v{font-family:var(--serif);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.srow.net{border-top:2px solid var(--ink);border-bottom:none;margin-top:6px;padding-top:12px}
.srow.net .k{color:var(--ink);font-weight:600;font-size:15px}
.srow.net .v{font-size:clamp(23px,5vw,29px)}
.v.e{color:var(--earned)} .v.s{color:var(--spent)}
.aside{margin-top:13px;padding-top:11px;border-top:1px dashed var(--rule);font-size:12.5px;color:var(--muted);line-height:1.6}
.aside+.aside{margin-top:8px;padding-top:8px}
.aside b{color:var(--held)} .aside b.warn{color:var(--earned)}

.band{display:flex;height:28px;border-radius:2px;overflow:hidden;border:1px solid var(--rule);margin-block:12px 10px}
.band i{display:block;height:100%}
.lg{display:flex;align-items:baseline;gap:10px;padding-block:7px;border-bottom:1px solid var(--rule);font-size:13.5px}
.lg:last-child{border-bottom:none}
.sw{width:11px;height:11px;border-radius:2px;flex:0 0 auto;transform:translateY(1px)}
.lg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .pc{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.lg .vl{font-variant-numeric:tabular-nums;font-weight:600}

.mods{border-top:1px solid var(--rule)}
.mod{display:flex;align-items:center;gap:13px;width:100%;background:none;border:none;border-bottom:1px solid var(--rule);
  padding:16px 2px;cursor:pointer;text-align:left;color:var(--ink)}
.mod:hover{background:rgba(0,0,0,.02)}
.mod .dot{width:4px;align-self:stretch;border-radius:2px;flex:0 0 auto}
.mod .l{flex:1;min-width:0}
.mod .t{display:block;font-size:15.5px;font-weight:600;line-height:1.3}
.mod .m{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.mod .m .warn{color:var(--spent);font-weight:600}
.mod .r{text-align:right;flex:0 0 auto}
.mod .v{display:block;font-family:var(--serif);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mod .v.zero{color:var(--muted);font-weight:400}
.mod .sv{display:block;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.mod .ch{color:var(--rule);font-size:15px;flex:0 0 auto}
.mod:hover .ch{color:var(--brass)}

.mhead{padding-block:20px 6px}
.mhead .big{font-family:var(--serif);font-size:clamp(26px,6.6vw,34px);font-weight:600;line-height:1.05;margin:0;letter-spacing:-.02em}
.mhead .sub{color:var(--muted);font-size:13px;margin:8px 0 0;max-width:58ch;line-height:1.55}
.how{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--brass);padding:12px 15px;
  margin-block:16px;font-size:13px;color:var(--muted);line-height:1.6}
.how b{color:var(--ink)}
.srch{width:100%;padding:10px 12px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);
  border-radius:2px;font-size:15px;margin-bottom:4px}
.srch:focus{outline:none;border-color:var(--brass);background:var(--bg)}

.card{border-bottom:1px solid var(--rule)}
.card.settled .cname{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.ctop{display:block;width:100%;background:none;border:none;padding:14px 2px;cursor:pointer;text-align:left;color:var(--ink)}
.ctop:hover{background:rgba(0,0,0,.02)}
.crow{display:flex;align-items:baseline;gap:12px}
.cname{font-weight:600;font-size:15.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flag{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:2px;
  flex:0 0 auto;border:1px solid}
.flag.late{color:var(--spent);border-color:var(--spent)}
.flag.soon{color:var(--earned);border-color:var(--earned)}
.flag.done{color:var(--held);border-color:var(--held)}
.flag.open{color:var(--brass);border-color:var(--brass)}
.cnum{font-family:var(--serif);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.cnum.e{color:var(--earned)} .cnum.s{color:var(--spent)}
.cmeta{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.cbody{padding:0 2px 18px}
.dl{display:flex;justify-content:space-between;gap:14px;padding-block:7px;border-bottom:1px solid var(--rule);font-size:13.5px}
.dl:last-of-type{border-bottom:none}
.dl dt{color:var(--muted);margin:0} .dl dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.dl dd.e{color:var(--earned)} .dl dd.h{color:var(--held)} .dl dd.q{color:var(--muted);font-weight:400}
.subhead{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:17px 0 8px}

.mrow{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--rule);margin-bottom:5px;
  cursor:pointer;background:var(--sheet);border-radius:2px}
.mrow:hover{border-color:var(--muted)}
.mrow.done{border-color:var(--held);background:rgba(44,104,80,.07)}
.mrow.late{border-color:var(--spent)}
.mrow.wait{opacity:.5;cursor:default;border-style:dashed}
.box{width:17px;height:17px;flex:0 0 auto;border:1.5px solid var(--rule);border-radius:2px;display:flex;
  align-items:center;justify-content:center;font-size:10px;color:transparent}
.mrow.done .box{background:var(--held);border-color:var(--held);color:var(--sheet)}
.mrow .dt{flex:1;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.mrow.done .dt{color:var(--held)} .mrow.late .dt{color:var(--spent)}
.mrow .on{font-size:11px;color:var(--held);font-variant-numeric:tabular-nums}
.mrow .va{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.mrow.done .va{color:var(--held)}

.mv{display:flex;align-items:center;gap:10px;padding-block:7px;border-bottom:1px solid var(--rule);font-size:13px}
.mv:last-of-type{border-bottom:none}
.mv .k{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;width:58px;flex:0 0 auto}
.mv .k.r{color:var(--held)} .mv .k.d{color:var(--earned)}
.mv .dt{flex:1;color:var(--muted);font-variant-numeric:tabular-nums}
.mv .vv{font-variant-numeric:tabular-nums;font-weight:600}
.x{background:none;border:none;color:var(--rule);font-size:16px;padding:0 2px;line-height:1;cursor:pointer}
.x:hover{color:var(--spent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;align-items:end;margin-top:12px}
.grid .wide{grid-column:1/-1}
label{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],select.fld{font-size:16px;padding:10px 12px;border:1px solid var(--rule);
  background:var(--bg);color:var(--ink);border-radius:2px;width:100%;font-variant-numeric:tabular-nums}
input:focus,select.fld:focus{outline:none;border-color:var(--brass);background:var(--sheet)}
.solid{background:var(--ink);color:var(--bg);border:1px solid var(--ink);padding:11px 18px;border-radius:2px;font-weight:600;font-size:14px}
.solid:hover{background:var(--brass);border-color:var(--brass);color:#fff}
.acts{display:flex;gap:15px;flex-wrap:wrap;margin-top:15px;padding-top:12px;border-top:1px solid var(--rule)}
.act{background:none;border:none;padding:0;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.act:hover{color:var(--ink)} .act.key{color:var(--brass);font-weight:600} .act.bad:hover{color:var(--spent)}
.panel{background:var(--sheet);border:1px solid var(--rule);padding:16px;margin-block:14px}
.hint{font-size:12.5px;color:var(--muted);margin:11px 0 0;line-height:1.55}
.err{color:var(--spent);font-size:13px;margin-top:10px}
.note{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--brass);padding:12px 15px;
  margin-block:16px;font-size:13px;color:var(--muted);line-height:1.55;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note span{flex:1;min-width:160px} .note b{color:var(--ink)}
.blank{padding:32px 4px;text-align:center;color:var(--muted);font-size:14px;border-bottom:1px solid var(--rule)}
.blank b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px;font-size:15px}
/* a quiet (i) that opens a plain-language note under the thing it explains */
.i{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;
  border:1px solid var(--rule);background:none;color:var(--muted);font-size:10px;font-weight:700;
  font-family:var(--serif);font-style:italic;line-height:1;cursor:pointer;padding:0;margin-left:6px;
  vertical-align:middle;flex:0 0 auto}
.i:hover{border-color:var(--brass);color:var(--brass)}
.i[aria-expanded="true"]{background:var(--brass);border-color:var(--brass);color:#fff}
.inote{background:var(--bg);border:1px solid var(--rule);border-left:3px solid var(--brass);
  padding:12px 14px;margin:10px 0 2px;font-size:13px;line-height:1.6;color:var(--ink)}
.inote b{font-weight:600}
.inote .eg{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);
  color:var(--muted);font-size:12.5px}
.hbox{background:var(--sheet);border:1px solid var(--rule);padding:16px 18px;margin-block:10px}
.hbox+.hbox{margin-top:-1px}
.hrow{display:flex;align-items:baseline;gap:12px}
.hk{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);flex:1;min-width:0}
.hv{font-family:var(--serif);font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hv.good{color:var(--held)} .hv.warn{color:var(--earned)} .hv.bad{color:var(--spent)}
.hs{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.agebar{display:flex;height:16px;border-radius:2px;overflow:hidden;border:1px solid var(--rule);margin:12px 0 10px}
.agebar i{display:block;height:100%}
.agekey{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.agekey span{display:flex;align-items:baseline;gap:5px}
.agekey b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.quick{display:flex;gap:8px;flex-wrap:wrap;padding:10px 2px 2px}
.qbtn{background:var(--sheet);border:1px solid var(--rule);color:var(--ink);font-size:12.5px;font-weight:600;
  padding:7px 12px;border-radius:2px;cursor:pointer}
.qbtn:hover{border-color:var(--brass);color:var(--brass)}
.fxnow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.fxnow b{font-family:var(--serif);font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.fxrow{display:flex;gap:10px;align-items:baseline;padding-block:6px;border-bottom:1px solid var(--rule2);font-size:12.5px}
.fxrow:last-child{border-bottom:none}
.fxrow .d{color:var(--muted);flex:1;font-variant-numeric:tabular-nums}
.fxrow .r{font-weight:600;font-variant-numeric:tabular-nums}
.fxrow .c{font-size:11.5px}
.fxrow .c.up{color:var(--spent)} .fxrow .c.dn{color:var(--held)}
.datout{width:100%;min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.45;
  padding:10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:2px;resize:vertical}
.undo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:3px;display:flex;gap:14px;align-items:center;
  font-size:13.5px;z-index:20;box-shadow:0 6px 22px rgba(0,0,0,.22);max-width:calc(100vw - 32px)}
.undo button{background:none;border:none;color:var(--brass);font-weight:700;font-size:13.5px;cursor:pointer;padding:0}
section{padding-block:22px}
h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 4px}
.sublede{color:var(--muted);font-size:13px;margin:0 0 14px;max-width:58ch}
footer{color:var(--muted);font-size:11.5px;line-height:1.7;border-top:1px solid var(--rule);padding-block:16px 0;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="root">
  <header>
    <button class="back" id="back" hidden aria-label="Back">&#8592;</button>
    <h1 class="mark" id="mark">I<i>W</i>P</h1>
    <div class="ctl">
      <select class="chip" id="year" aria-label="Year"></select>
      <button class="chip" id="lang">EN</button>
      <button class="chip" id="more">More</button>
    </div>
  </header>
  <div id="menuSlot"></div>
  <div id="screen"></div>
  <footer id="foot"></footer>
  <div id="undoSlot"></div>
  <input type="file" id="impFile" accept=".json,application/json" hidden>
</div>

<script>
(function(){
"use strict";

var APP_VER="v12 \u00b7 Myanmar text";          /* shown in the footer; bump every release */
var KEY="iwp_v4";                   /* never rename: live data sits under it */
var DBN="iwp_db",STORE="state";     /* IndexedDB mirror, survives a space squeeze */
var FBKEY="iwp_fb_v1";              /* this install's Firebase settings, never synced */
var MAILKEY="iwp_mail_v1";          /* the address this device asked for a link with */

var S={cur:"MMK",lang:"en",year:null,items:[],blur:false,backupAt:0,seeded:false,fx:[],fxRef:"USD",
       rev:{},dead:{}};
/* rev[id] = when this device last changed that record; dead[id] = when it deleted one.
   A tombstone has to outlive the record, or a device that never heard about the
   delete uploads the record again and brings it back. */

try{var raw=localStorage.getItem(KEY);if(raw){var p0=JSON.parse(raw);if(p0&&Array.isArray(p0.items))S=Object.assign(S,p0);}}catch(e){}
if(!S.rev||typeof S.rev!=="object")S.rev={};
if(!S.dead||typeof S.dead!=="object")S.dead={};
var NOW=new Date();

/* Nothing may be written until boot has finished reading. A half-loaded empty
   state saved over real data is the one unrecoverable bug. */
var loaded=false;

/* ---------- the device keeps two copies ---------- */
var idb=null;
function idbOpen(cb){
  if(idb)return cb(idb);
  try{
    var rq=indexedDB.open(DBN,1);
    rq.onupgradeneeded=function(){try{rq.result.createObjectStore(STORE);}catch(e){}};
    rq.onsuccess=function(){idb=rq.result;cb(idb);};
    rq.onerror=function(){cb(null);};
  }catch(e){cb(null);}
}
function idbPut(k,v){idbOpen(function(d){if(!d)return;
  try{d.transaction(STORE,"readwrite").objectStore(STORE).put(v,k);}catch(e){}});}
function idbGet(k,cb){idbOpen(function(d){if(!d)return cb(null);
  try{var r=d.transaction(STORE,"readonly").objectStore(STORE).get(k);
    r.onsuccess=function(){cb(r.result||null);};r.onerror=function(){cb(null);};
  }catch(e){cb(null);}});}

/* ---------- what changed here, and when ---------- */
var SEEN={};
function sig(o){try{return JSON.stringify(o);}catch(e){return String(o);}}
/* settings travel as one record called "core" so they merge like any other */
function coreOf(){return {cur:S.cur,lang:S.lang,fx:S.fx,fxRef:S.fxRef,blur:S.blur};}
function seedSeen(stamp){
  SEEN={};
  S.items.forEach(function(it){
    if(!it.id)it.id=uid();
    SEEN[it.id]=sig(it);
    if(stamp&&!S.rev[it.id])S.rev[it.id]=stamp;
  });
  SEEN.core=sig(coreOf());
  if(stamp&&!S.rev.core)S.rev.core=stamp;
}
function trackLocal(){
  if(!loaded)return;
  var now=Date.now(),here={};
  S.items.forEach(function(it){
    if(!it.id)it.id=uid();
    here[it.id]=1;
    var g=sig(it);
    if(SEEN[it.id]!==g){SEEN[it.id]=g;S.rev[it.id]=now;delete S.dead[it.id];}
  });
  Object.keys(SEEN).forEach(function(id){
    if(id==="core"||here[id])return;
    delete SEEN[id];delete S.rev[id];S.dead[id]=now;   /* tombstone */
  });
  var cg=sig(coreOf());
  if(SEEN.core!==cg){SEEN.core=cg;S.rev.core=now;}
}
function save(){
  if(!loaded)return;
  trackLocal();
  var j;try{j=JSON.stringify(S);}catch(e){return;}
  try{localStorage.setItem(KEY,j);}catch(e){}
  idbPut(KEY,j);
  if(typeof syncPush==="function")syncPush();
}

var infoOpen="";
function iof(k){var e=INFO[k];return e?(e[S.lang]||e.en):null;}
/* the button, and the note that opens under whatever block holds it */
function ib(k){return '<button class="i" type="button" data-i="'+k+'" aria-expanded="'+
  (infoOpen===k?"true":"false")+'" aria-label="'+esc(iof(k)?iof(k).t:k)+'">i</button>';}
function inote(){var k=infoOpen,e=iof(k);if(!e)return"";
  return '<div class="inote" role="note"><b>'+esc(e.t)+'</b> — '+e.b+
    (e.eg?'<span class="eg">'+e.eg+'</span>':'')+'</div>';}
function inoteFor(keys){return keys.indexOf(infoOpen)>=0?inote():"";}

/* loans, trading and leases only: this book follows cash earned and cash
   collected, not what anything is worth */
var ORDER=["ltloan","stloan","lease","cycle"];
function modOf(it){return it.type;}
function known(it){return !!(it&&it.type&&MODS[it.type]);}

/* ---------- dates ---------- */
function P(s){var a=String(s).split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
function isoOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addMonths(d,n){var day=d.getDate(),x=new Date(d.getTime());x.setDate(1);
  x.setFullYear(d.getFullYear(),d.getMonth()+n,1);
  var last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return x;}
function wholeM(a,b){if(!(b>a))return 0;var lo=0,hi=1;
  while(addMonths(a,hi)<=b){lo=hi;hi*=2;if(hi>1e5)break;}
  while(hi-lo>1){var m=Math.floor((lo+hi)/2);if(addMonths(a,m)<=b)lo=m;else hi=m;}return lo;}
function months(a,b){if(!(b>a))return 0;var w=wholeM(a,b),x=addMonths(a,w),y=addMonths(a,w+1);return w+(b-x)/(y-x);}
function yearEdges(Y){return[new Date(Y,0,1),new Date(Math.min(new Date(Y+1,0,1).getTime(),NOW.getTime()))];}
function sliceInYear(startISO,endISO,Y){
  var e0=yearEdges(Y),ys=e0[0],cap=e0[1];
  var s=new Date(Math.max(P(startISO).getTime(),ys.getTime()));
  var incl=endISO?new Date(P(endISO).getFullYear(),P(endISO).getMonth(),P(endISO).getDate()+1):null;
  var e=incl?new Date(Math.min(incl.getTime(),cap.getTime())):cap;
  return e>s?months(s,e):0;
}
function inYear(iso,Y){if(!iso)return false;var d=P(iso);return d.getFullYear()===Y&&d<=NOW;}
function dur(a,b){var w=wholeM(a,b),an=addMonths(a,w),d=Math.floor((b-an)/86400000),y=Math.floor(w/12),m=w%12;
  return (y?y+"y ":"")+((m||y)?m+"mo ":"")+d+"d";}
function daysBetween(a,b){return Math.round((b-a)/86400000);}
/* 2026-13-45 passes a regex but JS rolls it into 2027; round-trip to catch that */
function validDate(s){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;
  var d=P(s);
  if(isNaN(d.getTime())||isoOf(d)!==s)return false;
  return d.getFullYear()>=1900&&d.getFullYear()<=2200;
}

/* ---------- money ---------- */
function fmt(n){
  /* whole amounts read as whole amounts: $0, not $0.00 */
  var a=Math.abs(n),d=(a>=1000||Math.round(n)===n)?0:2;
  return n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});}
/* the kyat takes the bare $ because it is the home currency of this book;
   every other currency carries its code, so no figure can be read as the
   wrong money */
var SYM={MMK:"$",USD:"USD ",THB:"THB ",CAD:"CAD ",SGD:"SGD "};
function money(n){return (SYM[S.cur]||(S.cur+" "))+fmt(n);}
/* Myanmar counts in lakh (သိန်း = 100,000) — how the number actually gets said */
function lakh(n){if(S.cur!=="MMK"||Math.abs(n)<100000)return "";
  return (n/100000).toLocaleString("en-US",{maximumFractionDigits:1})+" သိန်း";}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function sgn(m){return m.kind==="repay"?-Math.abs(+m.amt||0):Math.abs(+m.amt||0);}
/* people type 1,500,000 and 1 500 000; parseFloat would quietly return 1 */
function num(v){
  if(typeof v==="number")return isFinite(v)?v:NaN;
  var t=String(v==null?"":v).replace(/[\s,\u00a0\u066c']/g,"");
  if(t==="")return 0;
  if(!/^-?\d*\.?\d+$/.test(t))return NaN;
  var n=parseFloat(t);return isFinite(n)?n:NaN;
}
/* 2%/month compounding is 26.8% a year, not 24% — worth stating plainly */
function ear(ratePct){return (Math.pow(1+(+ratePct||0)/100,12)-1)*100;}

/* ---------- long-term ---------- */
function ltWalk(it,Y){
  var r=(+it.rate||0)/100,start=P(it.start),ed=yearEdges(Y),yA=ed[0],yB=ed[1];
  var stop=it.settled&&it.settledOn?P(it.settledOn):NOW;
  var horizon=new Date(Math.min(stop.getTime(),NOW.getTime()));
  var mv=(it.moves||[]).map(function(m){return{t:P(m.date).getTime(),v:sgn(m)};})
    .filter(function(x){return x.t>=start.getTime()&&x.t<=horizon.getTime();})
    .sort(function(a,b){return a.t-b.t;});
  var pts=mv.map(function(x){return x.t;});
  pts.push(yA.getTime(),yB.getTime(),horizon.getTime());
  pts=pts.filter(function(t){return t>start.getTime()&&t<=horizon.getTime();})
         .sort(function(a,b){return a-b;}).filter(function(t,i,a){return i===0||t!==a[i-1];});
  /* principal and unpaid interest are tracked apart so a repayment can be split:
     it clears accrued interest first, and only the remainder is principal back.
     Without this, returning capital was being counted as income received. */
  var prin=+it.amount||0,accr=0,cursor=start,interest=0,intGot=0,prinBack=0,lent=0,lifetime=0;
  mv.forEach(function(x){if(x.t===start.getTime()){if(x.v>0)prin+=x.v;else prin=Math.max(0,prin+x.v);}});
  pts.forEach(function(t){
    var pp=new Date(t),bal=prin+accr;
    var grown=bal*Math.pow(1+r,months(cursor,pp)),step=grown-bal;
    lifetime+=step;accr+=step;
    if(cursor.getTime()>=yA.getTime()&&t<=yB.getTime())interest+=step;
    mv.forEach(function(x){
      if(x.t!==t)return;
      var inY=(t>=yA.getTime()&&t<=yB.getTime());
      if(x.v>0){prin+=x.v;if(inY)lent+=x.v;}
      else{
        var pay=-x.v,toInt=Math.min(accr,pay);
        accr-=toInt;pay-=toInt;
        var toPrin=Math.min(prin,pay);prin-=toPrin;
        if(inY){intGot+=toInt;prinBack+=toPrin;}
      }
    });
    cursor=pp;
  });
  if(it.settled){prin=0;accr=0;}
  return{earned:interest,collected:intGot,principalBack:prinBack,lent:lent,
         held:prin+accr,principal:prin,accrued:accr,lifetime:lifetime};
}
/* ---------- short-term ---------- */
function stBalanceAt(it,d){
  var b=(P(it.start)<=d)?(+it.amount||0):0;
  (it.moves||[]).forEach(function(m){if(P(m.date)<=d)b+=sgn(m);});
  return Math.max(0,b);
}
function stWeighted(it,from,to){
  var span=to-from; if(span<=0)return stBalanceAt(it,to);
  var pts=(it.moves||[]).map(function(m){return{d:P(m.date),v:sgn(m)};})
    .filter(function(x){return x.d>from&&x.d<=to;}).sort(function(a,b){return a.d-b.d;});
  var acc=0,cursor=from,bal=stBalanceAt(it,from);
  pts.forEach(function(x){acc+=bal*(x.d-cursor);bal=Math.max(0,bal+x.v);cursor=x.d;});
  acc+=bal*(to-cursor);
  return acc/span;
}
function stWalk(it,Y){
  var r=(+it.rate||0)/100,start=P(it.start),ed=yearEdges(Y),yA=ed[0],yB=ed[1];
  var stop=it.settled&&it.settledOn?P(it.settledOn):NOW;
  var horizon=new Date(Math.min(stop.getTime(),NOW.getTime()));
  var pm=it.paid||{},rolled=0,earned=0,collected=0,prev=start,n=1,due,rows=[],unpaid=0,unpaidAmt=0,oldestMiss=null;
  while(n<1200){
    due=addMonths(start,n);
    if(due>horizon)break;
    var avg=stWeighted(it,prev,due),amt=(avg+rolled)*r,key=isoOf(due),mk=pm[key];
    var inY=due>=yA&&due<=yB;
    if(inY)earned+=amt;
    if(mk){if(inY)collected+=amt;}
    else{rolled+=amt;unpaid++;unpaidAmt+=amt;if(!oldestMiss)oldestMiss=key;}
    rows.push({due:key,amt:amt,avg:avg,paid:!!mk,on:(typeof mk==="string"?mk:null),inY:inY});
    prev=due;n++;
  }
  var nb=it.settled?0:stBalanceAt(it,NOW);
  return{earned:earned,collected:collected,held:it.settled?0:nb+rolled,bal:nb,rolled:rolled,rows:rows,
    unpaid:unpaid,unpaidAmt:unpaidAmt,oldestMiss:oldestMiss,
    next:{due:isoOf(addMonths(start,n)),amt:(nb+rolled)*r}};
}

/* ---------- lines ---------- */
/* rent arrives in pieces; keeping each one lets a wrong entry be removed */
function leaseGot(it){
  if(Array.isArray(it.gots))return it.gots.reduce(function(s,g){return s+(+g.amt||0);},0);
  return +it.got||0;
}
function lineFor(it,Y){
  if(it.type==="ltloan"){
    var L=ltWalk(it,Y),meta=[t("mRate",{r:(+it.rate||0)}),t("mRunning",{d:dur(P(it.start),NOW)})];
    if(L.collected>0)meta.push(t("mRepaid",{v:money(L.collected)}));
    if(L.lent>0)meta.push(t("mLentAgain",{v:money(L.lent)}));
    if(it.settled)meta=[t("mSettled",{d:it.settledOn||""})];
    return{it:it,earned:L.earned,collected:L.collected,held:L.held,meta:meta,calc:L,flag:it.settled?"done":""};
  }
  if(it.type==="stloan"){
    var T=stWalk(it,Y),m2=[t("mRate",{r:(+it.rate||0)}),t("mOut",{v:money(T.bal)})];
    if(T.unpaid>0)m2.push(T.unpaid===1?t("mUnpaid1"):t("mUnpaid",{n:T.unpaid}));
    if(it.settled)m2=[t("mSettled",{d:it.settledOn||""})];
    return{it:it,earned:T.earned,collected:T.collected,held:T.held,meta:m2,calc:T,
      flag:it.settled?"done":(T.unpaid>=2?"late":T.unpaid===1?"soon":"")};
  }
  if(it.type==="lease"){
    var m=sliceInYear(it.start,it.end,Y),earned=m*(+it.rent||0);
    var got=leaseGot(it),ended=it.end&&P(it.end)<NOW;
    var full=(+it.rent||0)*(it.end?sliceInYear(it.start,it.end,P(it.end).getFullYear()):m);
    var meta3=[t("mRent",{v:money(+it.rent||0)}),t("mMonthsIn",{m:(Math.round(m*100)/100),y:Y})];
    if(got>0)meta3.push(t("mCollected",{v:money(got)}));
    var flag="";
    if(ended&&got<earned-0.5)flag="late";
    else if(it.end&&!ended&&daysBetween(NOW,P(it.end))<=30)flag="soon";
    else if(got>=earned-0.5&&earned>0)flag="done";
    var due=Math.max(0,earned-got);
    return{it:it,earned:earned,collected:Math.min(got,earned),held:due,meta:meta3,
      calc:{months:m,got:got,due:due,ended:ended,full:full},flag:flag};
  }
  if(it.type==="cycle"){
    var goods=+it.cost||0,extra=+it.extra||0,cst=goods+extra,rev=+it.revenue||0,bgt=it.bought||"";
    /* still in the store: the cash has gone out and the result is not known,
       so it counts as money tied up, never as profit, until the sale happens */
    if(!it.sold){
      var hm=bgt?months(P(bgt),NOW):0;
      return{it:it,earned:0,collected:0,held:cst,
        meta:[t("boughtLbl")+" "+(bgt||"—"),bgt?t("heldSoFar",{m:hm.toFixed(1)}):"",t("tiedUpLbl")+" "+money(cst)].filter(Boolean),
        calc:{hm:hm,cost:cst,open:true},flag:"open"};
    }
    var span=bgt?months(P(bgt),P(it.sold)):0,gain=rev-cst;
    var e=inYear(it.sold,Y)?gain:0;
    var pm=(span>0.03&&cst>0)?(gain/cst*100)/span:null;
    return{it:it,earned:e,collected:e,held:0,
      meta:[(bgt?bgt+" → ":"")+it.sold,
            span>0?t("heldMo",{m:span.toFixed(1)}):"",
            money(cst)+" → "+money(rev)].filter(Boolean),
      calc:{hm:span,cost:cst,rev:rev,pm:pm,open:false},flag:""};
  }
  return{it:it,earned:0,collected:0,held:0,meta:[],calc:{},flag:""};
}
function evaluate(Y){
  var earned=0,costs=0,collected=0,outLoan=0,unpaid=0;
  var lines=S.items.map(function(it){return lineFor(it,Y);});
  lines.forEach(function(l){
    if(l.earned>0){earned+=l.earned;collected+=l.collected;
      unpaid+=Math.max(0,l.earned-l.collected);}
    if(l.earned<0)costs+=-l.earned;
    if(l.it.type==="ltloan"||l.it.type==="stloan")outLoan+=l.held;
  });
  return{earned:earned,costs:costs,collected:collected,paper:0,outLoan:outLoan,
    uncollected:unpaid,net:earned-costs,lines:lines};
}
function modSummary(key,R){
  var ls=R.lines.filter(function(l){return modOf(l.it)===key;});
  var e=0,h=0,alerts=0;
  ls.forEach(function(l){e+=l.earned;h+=l.held;if(l.flag==="late")alerts++;});
  return{lines:ls,count:ls.length,earned:e,held:h,alerts:alerts};
}
/* what actually needs doing, newest trouble first */
function attention(R){
  var out=[];
  R.lines.forEach(function(l){
    if(l.it.settled)return;
    if(l.it.type==="stloan"&&l.calc.unpaid>0)
      out.push({id:l.it.id,mod:"stloan",rank:l.calc.unpaid>=2?0:1,
        title:l.it.name,why:(l.calc.unpaid===1?t("aUnpaid1",{d:l.calc.oldestMiss}):t("aUnpaid",{n:l.calc.unpaid,d:l.calc.oldestMiss})),
        amt:l.calc.unpaidAmt,tone:l.calc.unpaid>=2?"late":"soon"});
    if(l.it.type==="lease"&&l.flag==="late")
      out.push({id:l.it.id,mod:"lease",rank:0,title:l.it.name,
        why:t("aTermEnded",{d:l.it.end}),amt:l.calc.due,tone:"late"});
    if(l.it.type==="lease"&&l.flag==="soon")
      out.push({id:l.it.id,mod:"lease",rank:2,title:l.it.name,
        why:t("aTermEnds",{d:l.it.end,n:daysBetween(NOW,P(l.it.end))}),amt:l.calc.due||l.earned,tone:"soon"});
  });
  return out.sort(function(a,b){return a.rank-b.rank||b.amt-a.amt;});
}
/* one list of every borrower, whichever ledger they sit in */
function debtors(R){
  return R.lines.filter(function(l){return (l.it.type==="ltloan"||l.it.type==="stloan")&&!l.it.settled&&l.held>0;})
    .sort(function(a,b){var r={late:0,soon:1,open:2,"":3},ra=r[a.flag],rb=r[b.flag];
      if(ra===undefined)ra=3;if(rb===undefined)rb=3;
      return (ra-rb)||(b.held-a.held);});
}
/* ---- the four readings ----
   aging: money out, split by how many months of interest are unpaid.
   xirr : the rate that makes every dated cash movement balance to zero.
   real : nominal return adjusted by a rate the user typed, never assumed.
   bedr : how much of the book can go bad before the rate stops covering it. */
function aging(R){
  var b={cur:0,m1:0,m23:0,m3:0},total=0;
  R.lines.forEach(function(l){
    if((l.it.type!=="ltloan"&&l.it.type!=="stloan")||l.it.settled||l.held<=0)return;
    total+=l.held;
    var u=(l.it.type==="stloan")?(l.calc.unpaid||0):0;
    if(u===0)b.cur+=l.held; else if(u===1)b.m1+=l.held;
    else if(u<=3)b.m23+=l.held; else b.m3+=l.held;
  });
  b.total=total;return b;
}
function cashFlows(R){
  var f=[];
  R.lines.forEach(function(l){
    var it=l.it;
    if(it.type!=="ltloan"&&it.type!=="stloan")return;
    f.push({d:P(it.start),v:-(+it.amount||0)});
    (it.moves||[]).forEach(function(m){
      f.push({d:P(m.date),v:(m.kind==="repay"?1:-1)*Math.abs(+m.amt||0)});});
    if(it.type==="stloan"&&l.calc.rows)
      l.calc.rows.forEach(function(r){if(r.paid)f.push({d:P(r.on||r.due),v:r.amt});});
    if(l.held>0)f.push({d:NOW,v:l.held});
  });
  return f.sort(function(a,b){return a.d-b.d;});
}
function xirr(f){
  if(f.length<2)return null;
  if(!f.some(function(x){return x.v>0;})||!f.some(function(x){return x.v<0;}))return null;
  var t0=f[0].d;
  function npv(r){var s=0;for(var i=0;i<f.length;i++)s+=f[i].v/Math.pow(1+r,(f[i].d-t0)/(365.25*86400000));return s;}
  var lo=-0.9999,hi=10;
  if(npv(lo)<0||npv(hi)>0)return null;
  for(var i=0;i<160;i++){var m=(lo+hi)/2;if(npv(m)>0)lo=m;else hi=m;}
  var out=(lo+hi)/2;
  return isFinite(out)?out:null;
}
/* depreciation between the earliest rate saved this year and the latest */
function fxChange(){
  var h=(S.fx||[]).slice().sort(function(a,b){return a.date<b.date?-1:1;});
  if(h.length<2)return null;
  var last=h[h.length-1],first=h[0];
  for(var i=0;i<h.length;i++){if(P(h[i].date).getFullYear()===S.year){first=h[i];break;}}
  if(first===last)first=h[h.length-2];
  if(!(+first.rate>0)||!(+last.rate>0))return null;
  return{from:first,to:last,dep:(+last.rate)/(+first.rate)-1};
}
function avgRate(R){
  var w=0,tot=0;
  R.lines.forEach(function(l){
    if((l.it.type!=="ltloan"&&l.it.type!=="stloan")||l.it.settled||l.held<=0)return;
    w+=l.held*(+l.it.rate||0);tot+=l.held;});
  return tot>0?w/tot:0;
}
/* a few ratios that say something a total cannot */
function health(R){
  var loans=R.lines.filter(function(l){return (l.it.type==="ltloan"||l.it.type==="stloan")&&!l.it.settled;});
  var out=loans.reduce(function(s,l){return s+l.held;},0);
  var top=loans.slice().sort(function(a,b){return b.held-a.held;})[0];
  var earnedLoans=loans.reduce(function(s,l){return s+l.earned;},0);
  var elapsed=months(new Date(S.year,0,1),yearEdges(S.year)[1])||1;
  return{out:out,
    concentration:out>0&&top?top.held/out*100:0,topName:top?top.it.name:"",
    yield:out>0?(earnedLoans/elapsed*12)/out*100:0,
    collection:R.earned>0?R.collected/R.earned*100:100};
}

/* ---------- import ---------- */
function sameAs(a,b){
  return a.type===b.type&&String(a.name).trim()===String(b.name).trim()&&
    Math.abs((+a.amount||+a.rent||0)-(+b.amount||+b.rent||0))<0.5&&
    (a.start||"")===(b.start||"");
}
function importLedger(d){
  var out=[],n=0,dupes=0;
  if(d&&Array.isArray(d.people)&&!d.longTerm)d={longTerm:d};
  if(d&&d.longTerm&&Array.isArray(d.longTerm.people))d.longTerm.people.forEach(function(p){
    var ls=p.loans||[];
    ls.forEach(function(L,i){
      if(!(+L.amount>0)||!L.date)return;
      out.push({id:uid(),type:"ltloan",name:String(p.name||"—")+(ls.length>1?" #"+(i+1):""),
        amount:+L.amount,rate:+L.rate||0,start:L.date,note:"",
        moves:(L.payments||[]).filter(function(y){return +y.amount>0&&y.date;})
          .map(function(y){return{id:uid(),date:y.date,amt:+y.amount,kind:"repay"};})});
      n++;});
  });
  if(d&&d.shortTerm&&Array.isArray(d.shortTerm.people))d.shortTerm.people.forEach(function(p){
    if(!(+p.principal>0)||!p.date)return;
    out.push({id:uid(),type:"stloan",name:String(p.name||"—"),amount:+p.principal,
      rate:+p.rate||0,start:p.date,paid:p.paid||{},
      note:(p.collateral&&p.collateral.note)?String(p.collateral.note):"",
      moves:(p.moves||[]).filter(function(m){return +m.amt>0&&m.date;})
        .map(function(m){return{id:uid(),date:m.date,amt:+m.amt,kind:m.kind==="repay"?"repay":"draw"};})});
    n++;});
  if(d&&d.land&&Array.isArray(d.land.plots))d.land.plots.forEach(function(pl){
    if(!(+pl.rent>0)||!pl.start)return;
    var mm=pl.end?sliceInYear(pl.start,pl.end,P(pl.end).getFullYear()):0;
    out.push({id:uid(),type:"lease",name:String(pl.name||"—"),rent:+pl.rent,
      start:pl.start,end:pl.end||"",value:0,got:pl.paid?(+pl.rent)*mm:0});
    n++;});
  var fresh=out.filter(function(o){
    var hit=S.items.some(function(x){return sameAs(x,o);});
    if(hit)dupes++;
    return !hit;});
  return{items:fresh,count:fresh.length,dupes:dupes,total:n};
}

    .map(function(it){var o=Object.assign({},it);o.id=o.id||uid();

      '<div class="srow net">'+esc(t("profit"))+'<span class="v n hide">'+esc(money(R.net))+'</span></div>'+
      (R.uncollected>0?'<p class="aside">'+t("asideUncollected",{v:esc(money(R.uncollected))})+ib("accrual")+'</p>':'')+

      (H.out>0&&H.concentration>=40?'<p class="aside">'+t("asideConc",{p:H.concentration.toFixed(0),n:esc(H.topName)})+ib("conc")+'</p>':'')+
      inoteFor(["accrual","conc"])+
    '</div></section>';

  var dl=debtors(R);
  if(dl.length){
    var owed=dl.reduce(function(a,l){return a+l.held;},0);
    h+='<section><h3>'+esc(t("whoOwes"))+'</h3>'+
      '<p class="sublede">'+esc(t("whoOwesSub",{n:dl.length,v:money(owed)}))+
      (lakh(owed)?' \u00b7 '+esc(lakh(owed)):'')+'</p>';
    dl.forEach(function(l){
      var f=l.flag==="late"?t("chase"):l.flag==="soon"?t("due"):"";
      h+='<button class="mod" data-jump="'+l.it.type+'" data-item="'+l.it.id+'">'+
        '<span class="dot" style="background:'+MODS[l.it.type].color+'"></span>'+
        '<span class="l"><span class="t">'+esc(l.it.name)+'</span>'+
        '<span class="m">'+esc(l.meta.slice(0,2).join(" \u00b7 "))+'</span></span>'+
        '<span class="r"><span class="v n hide">'+esc(money(l.held))+'</span>'+
        (f?'<span class="sv" style="color:var(--'+(l.flag==="late"?"spent":"earned")+')">'+f+'</span>':'')+'</span>'+
        '<span class="ch">\u203a</span></button>';});
    h+='</section>';
  }
  /* four readings, in one quiet block */
  var AG=aging(R),X=xirr(cashFlows(R)),FXC=fxChange(),avg=avgRate(R),H2=H;
  if(AG.total>0||X!==null){
    h+='<section><h3>'+esc(t("health"))+'</h3><p class="sublede">'+esc(t("healthSub"))+'</p>';
    if(AG.total>0){
      var segs=[["cur","#2C6850"],["m1","#B08A3E"],["m23","#C2663F"],["m3","#9A4030"]];
      h+='<div class="hbox"><div class="hrow"><span class="hk">'+esc(t("ageTitle"))+ib("aging")+'</span></div>'+
        '<div class="agebar">'+segs.map(function(sg){
          return AG[sg[0]]>0?'<i style="width:'+(AG[sg[0]]/AG.total*100).toFixed(2)+'%;background:'+sg[1]+'"></i>':"";}).join("")+'</div>'+
        '<div class="agekey">'+
          '<span><i class="sw" style="background:#2C6850"></i>'+esc(t("ageCurrent"))+' <b>'+(AG.cur/AG.total*100).toFixed(0)+'%</b></span>'+
          (AG.m1>0?'<span><i class="sw" style="background:#B08A3E"></i>'+esc(t("age1"))+' <b>'+(AG.m1/AG.total*100).toFixed(0)+'%</b></span>':'')+
          (AG.m23>0?'<span><i class="sw" style="background:#C2663F"></i>'+esc(t("age23"))+' <b>'+(AG.m23/AG.total*100).toFixed(0)+'%</b></span>':'')+
          (AG.m3>0?'<span><i class="sw" style="background:#9A4030"></i>'+esc(t("age3"))+' <b>'+(AG.m3/AG.total*100).toFixed(0)+'%</b></span>':'')+
        '</div>'+((AG.m3>0)?'<p class="hs">'+esc(t("ageNote"))+'</p>':'')+inoteFor(["aging"])+'</div>';
    }
    if(X!==null)h+='<div class="hbox"><div class="hrow"><span class="hk">'+esc(t("xirrTitle"))+ib("xirr")+'</span>'+
      '<span class="hv hide '+(X>0?"good":"bad")+'">'+(X*100).toFixed(1)+'%</span></div>'+
      '<p class="hs">'+esc(t("xirrSub"))+' \u00b7 '+esc(t("xirrVsSimple",{v:H2.yield.toFixed(1)+"%"}))+'</p>'+inoteFor(["xirr"])+'</div>';
    var nominal=X!==null?X*100:H2.yield;
    if(FXC&&Math.abs(FXC.dep)>0.0001){
      var realPc=((1+nominal/100)/(1+FXC.dep)-1)*100;
      h+='<div class="hbox"><div class="hrow"><span class="hk">'+esc(t("realTitle"))+ib("real")+'</span>'+
        '<span class="hv hide '+(realPc>0?"good":"bad")+'">'+realPc.toFixed(1)+'%</span></div>'+
        '<p class="hs">'+esc(t("realSub",{n:nominal.toFixed(1),r:realPc.toFixed(1)}))+' \u00b7 '+
        esc(t("fxChange",{p:Math.abs(FXC.dep*100).toFixed(1),dir:FXC.dep>0?t("weaker"):t("stronger"),d:FXC.from.date}))+'</p>'+inoteFor(["real"])+'</div>';
    } else if(AG.total>0){
      h+='<div class="hbox"><div class="hrow"><span class="hk">'+esc(t("realTitle"))+ib("real")+'</span>'+
        '<span class="hv" style="color:var(--faint)">\u2014</span></div>'+
        '<p class="hs">'+esc((S.fx||[]).length?t("realFlat"):t("realNeed"))+' '+
        '<button class="qbtn" id="fxJump" style="margin-left:4px">'+esc(t("fxTitle"))+'</button></p>'+inoteFor(["real"])+'</div>';
    }
    if(avg>0){
      var e=Math.pow(1+avg/100,12)-1;
      h+='<div class="hbox"><div class="hrow"><span class="hk">'+esc(t("beTitle"))+ib("bedr")+'</span>'+
        '<span class="hv hide">'+(e/(1+e)*100).toFixed(0)+'%</span></div>'+
        '<p class="hs">'+esc(t("beSub",{r:avg.toFixed(2),p:(e/(1+e)*100).toFixed(0)}))+
        ' \u00b7 '+esc(t("earIs",{v:(e*100).toFixed(1)+"%"}))+ib("ear")+'</p>'+inoteFor(["bedr","ear"])+'</div>';
    }
    h+='</section>';
  }
  var held=R.lines.filter(function(l){return l.held>0;}).sort(function(a,b){return b.held-a.held;});
  if(held.length){
    var tot=held.reduce(function(s,l){return s+l.held;},0);
    h+='<section><h3>'+esc(t("wealth"))+'</h3>'+
      '<p class="sublede">'+esc(t("wealthSub",{v:money(tot)}))+(lakh(tot)?' \u00b7 '+esc(lakh(tot)):'')+'</p>'+
      '<div class="band">'+held.map(function(l){
        return '<i style="width:'+(l.held/tot*100).toFixed(2)+'%;background:'+MODS[modOf(l.it)].color+'"></i>';}).join("")+'</div>'+
      held.slice(0,8).map(function(l){
        return '<div class="lg"><span class="sw" style="background:'+MODS[modOf(l.it)].color+'"></span>'+
          '<span class="nm">'+esc(l.it.name)+'</span><span class="pc">'+(l.held/tot*100).toFixed(0)+'%</span>'+
          '<span class="vl hide">'+esc(money(l.held))+'</span></div>';}).join("")+'</section>';
  }
  return h;
}

function FIELDS(ty){
  if(ty==="ltloan")return[["name",t("fBorrower"),"text"],["amount",t("fAmountLent"),"number"],
    ["rate",t("fRateMo"),"number","2"],["start",t("fLentOn"),"date",isoOf(NOW)],["note",t("fNote"),"text"]];
  if(ty==="stloan")return[["name",t("fBorrower"),"text"],["amount",t("fPrincipal"),"number"],
    ["rate",t("fRateMo"),"number","3"],["start",t("fLentOn"),"date",isoOf(NOW)],["note",t("fNote"),"text"]];
  if(ty==="lease")return[["name",t("fName"),"text"],["rent",t("fRent"),"number"],
    ["start",t("fStarts"),"date",isoOf(NOW)],["end",t("fEnds"),"date"]];
  if(ty==="cycle")return[["name",t("fWhatItWas"),"text"],["cost",t("fGoodsCost"),"number"],
    ["extra",t("fOtherCost"),"number","0"],
    ["bought",t("fBoughtOn"),"date",isoOf(NOW)],
    ["revenue",t("fTotalSold"),"number"],["sold",t("fSoldOnOpt"),"date"]];
  return[];
}
function formPanel(ty,src,idPrefix,submitLabel,action,extra){
  return '<div class="panel">'+(extra||"")+
    '<div class="grid">'+FIELDS(ty).map(function(f){
      var v=src?(src[f[0]]===undefined?"":src[f[0]]):(f[3]||"");
      return '<div><label for="'+idPrefix+f[0]+'">'+esc(f[1])+'</label>'+
        '<input id="'+idPrefix+f[0]+'" type="'+(f[2]==="number"?"text":f[2])+'"'+
        (f[2]==="number"?' inputmode="decimal" autocomplete="off"':'')+
        ' value="'+esc(v)+'"></div>';}).join("")+
    '<button class="solid wide" data-'+action+'="1">'+esc(submitLabel)+'</button></div>'+
    '<p class="err" id="'+idPrefix+'err" hidden></p></div>';
}
function readForm(ty,prefix){
  var o={};
  FIELDS(ty).forEach(function(f){
    var el=$(prefix+f[0]),v=el?String(el.value).trim():"";
    o[f[0]]=(f[2]==="number")?num(v):v;});
  return o;
}
function validate(ty,o){
  if(!o.name)return t("eName");
  var numFields=FIELDS(ty).filter(function(f){return f[2]==="number";});
  for(var i=0;i<numFields.length;i++){
    var nk=numFields[i][0];
    /* an optional figure left blank, or missing from an older saved entry,
       is zero rather than an error */
    if(o[nk]===undefined||o[nk]==="")o[nk]=0;
    if(isNaN(o[nk]))return t("eNotNumber",{f:numFields[i][1]});
  }
  if(ty==="ltloan"||ty==="stloan"){
    if(!(o.amount>0))return t("eHowMuch");
    if(!(o.rate>=0&&o.rate<=100))return t("eRate");
    if(!validDate(o.start))return t("eDateValid");
    if(P(o.start)>NOW)return t("eFuture");
  }
  if(ty==="lease"){
    if(!(o.rent>0))return t("eRent");
    if(!validDate(o.start))return t("eStart");
    if(o.end&&!validDate(o.end))return t("eEndDate");
    if(o.end&&P(o.end)<=P(o.start))return t("eEndAfter");
  }
  if(ty==="cycle"){
    if(!(o.cost>0))return t("eCostPos");
    if(o.extra<0)return t("eCostPos");
    if(!validDate(o.bought))return t("eBuyDate");
    if(P(o.bought)>NOW)return t("eFuture");
    if(o.sold){
      if(!validDate(o.sold))return t("eSaleDate");
      if(P(o.sold)<P(o.bought))return t("eSellAfter");
      if(!(o.revenue>0))return t("eSoldFor");
    }
  }
  return "";
}

/* ---------- module page ---------- */
function modView(key,Y,R){
  var MM=M(key),m=modSummary(key,R);
  var big=m.earned?((m.earned>0?"+":"−")+money(Math.abs(m.earned))):money(0);
  var sub=t("earnedIn",{y:Y})+(m.held?" \u00b7 "+t(key==="cycle"?"stillTied":key==="lease"?"stillDue":"stillOut",{v:money(m.held)}):"");
  var h='<div class="mhead"><p class="eyebrow">'+esc(MM.label)+'</p>'+
    '<p class="big n hide">'+esc(big)+'</p><p class="sub">'+esc(sub)+'</p></div>'+
    '<div class="how">'+MM.how+'</div>';
  if(m.count>=6)h+='<input class="srch" id="q" type="text" placeholder="'+esc(t("search",{m:MM.label}))+'" value="'+esc(q)+'">';
  h+='<div class="ctl" style="margin:10px 0 6px"><button class="chip" id="addToggle" aria-pressed="'+addOpen+'">'+
      (addOpen?t("close"):t("addA",{o:MM.one}))+'</button></div>';
  if(addOpen)h+=formPanel(key,null,"fl_",t("add"),"addgo","");

  var list=m.lines;
  if(q)list=list.filter(function(l){return l.it.name.toLowerCase().indexOf(q.toLowerCase())>=0;});
  list=list.slice().sort(function(a,b){
    var r={late:0,soon:1,"":2,done:3};
    var ra=r[a.flag],rb=r[b.flag];if(ra===undefined)ra=9;if(rb===undefined)rb=9;
    return (ra-rb)||(Math.abs(b.earned)-Math.abs(a.earned))||(b.held-a.held);});

  if(!m.count)h+='<div class="blank"><b>'+esc(t("nothingHere"))+'</b>'+esc(t("addFirst",{o:MM.one}))+'</div>';
  else if(!list.length)h+='<div class="blank"><b>'+esc(t("noMatch"))+'</b>'+esc(t("noMatchSub",{q:q}))+'</div>';

  list.forEach(function(l){
    var e=l.earned,op=!!openCard[l.it.id];
    var fig=(e!==0?(e>0?"+":"−")+money(Math.abs(e)):"—");
    var flagTxt=l.flag==="late"?t("chase"):l.flag==="soon"?t("due"):l.flag==="done"?t("clear"):
                l.flag==="open"?t("roundOpen"):"";
    h+='<div class="card'+(l.it.settled?" settled":"")+'"><button class="ctop" data-card="'+l.it.id+'">'+
      '<span class="crow"><span class="cname">'+esc(l.it.name)+'</span>'+
      (flagTxt?'<span class="flag '+l.flag+'">'+flagTxt+'</span>':'')+
      '<span class="cnum n hide '+(e>0?"e":e<0?"s":"")+'">'+esc(fig)+'</span></span>'+
      '<span class="cmeta">'+l.meta.map(function(x){return '<span>'+esc(x)+'</span>';}).join("")+'</span></button>'+
      ((!op&&!l.it.settled&&(key==="ltloan"||key==="stloan"))
        ? '<div class="quick"><button class="qbtn" data-quick="repay" data-p="'+l.it.id+'">'+esc(t("theyPaid"))+'</button>'+
          '<button class="qbtn" data-quick="draw" data-p="'+l.it.id+'">'+esc(t("iLentMore"))+'</button></div>' : '')+
      (op?'<div class="cbody">'+
        (editing===l.it.id
          ? formPanel(l.it.type,l.it,"ed_",t("save"),"savego")
          : (l.it.type==="ltloan"?ltBody(l):l.it.type==="stloan"?stBody(l):l.it.type==="lease"?leaseBody(l):plainBody(l)))+
        '</div>':'')+'</div>';
  });
  return h;
}

    ? t("storedHere")+" \u00b7 "+(S.backupAt?t("lastBackup",{d:new Date(S.backupAt).toISOString().slice(0,10)}):t("neverBacked"))+

}
function setUndo(label,fn){
  undo={label:label,fn:fn};
  if(setUndo.t)clearTimeout(setUndo.t);
  setUndo.t=setTimeout(function(){undo=null;render();},8000);
}

/* ---------- wiring ---------- */
function wire(){
  each("[data-i]",function(b){b.onclick=function(ev){
    ev.stopPropagation();var k=b.getAttribute("data-i");
    infoOpen=(infoOpen===k)?"":k;render();};});
  each("[data-go]",function(b){b.onclick=function(){
    VIEW=b.getAttribute("data-go");openCard={};addOpen=false;editing=null;q="";window.scrollTo(0,0);render();};});
  each("[data-jump]",function(b){b.onclick=function(){
    VIEW=b.getAttribute("data-jump");openCard={};openCard[b.getAttribute("data-item")]=true;
    addOpen=false;editing=null;q="";window.scrollTo(0,0);render();};});
  each("[data-quick]",function(b){b.onclick=function(){
    var id=b.getAttribute("data-p");
    openCard[id]=true;quickKind=b.getAttribute("data-quick");quickFor=id;editing=null;render();
    var el=$("ma_"+id);if(el)setTimeout(function(){el.focus();},40);};});
  each("[data-card]",function(b){b.onclick=function(){
    var id=b.getAttribute("data-card");openCard[id]=!openCard[id];if(editing&&editing!==id)editing=null;render();};});

  each("[data-del]",function(b){b.onclick=function(){
    var id=b.getAttribute("data-del"),it=find(id);if(!it)return;
    var copy=JSON.parse(JSON.stringify(it)),idx=S.items.indexOf(it);
    S.items.splice(idx,1);delete openCard[id];editing=null;save();
    setUndo(t("undoDeleted",{n:copy.name}),function(){S.items.splice(idx,0,copy);save();});
    render();};});
  each("[data-settle]",function(b){b.onclick=function(){
    var it=find(b.getAttribute("data-settle"));if(!it)return;
    if(it.settled){it.settled=false;delete it.settledOn;}
    else{it.settled=true;it.settledOn=isoOf(NOW);}
    save();render();};});
  each("[data-edit]",function(b){b.onclick=function(){editing=b.getAttribute("data-edit");render();};});
  each("[data-savego]",function(b){b.onclick=function(){
    var it=find(editing);if(!it)return;
    var o=readForm(it.type,"ed_"),err=$("ed_err"),msg=validate(it.type,o);
    if(msg){err.textContent=msg;err.hidden=false;return;}
    Object.keys(o).forEach(function(k){it[k]=o[k];});
    editing=null;save();render();};});

  each("[data-tick]",function(b){b.onclick=function(){
    var it=find(b.getAttribute("data-tick")),k=b.getAttribute("data-k");if(!it)return;
    it.paid=it.paid||{};
    if(it.paid[k])delete it.paid[k];else it.paid[k]=isoOf(NOW);
    save();render();};});
  each("[data-delmv]",function(b){b.onclick=function(){
    var it=find(b.getAttribute("data-on")),mid=b.getAttribute("data-delmv");if(!it)return;
    var mv=(it.moves||[]).filter(function(m){return m.id===mid;})[0],idx=(it.moves||[]).indexOf(mv);
    it.moves=(it.moves||[]).filter(function(m){return m.id!==mid;});save();
    if(mv)setUndo(mv.kind==="repay"?t("undoRemovedPay",{v:money(Math.abs(+mv.amt||0))}):t("undoRemovedLend",{v:money(Math.abs(+mv.amt||0))}),
      function(){it.moves.splice(idx,0,mv);save();});
    render();};});
  each("[data-addmv]",function(b){b.onclick=function(){
    var pid=b.getAttribute("data-addmv"),it=find(pid);if(!it)return;
    var err=document.querySelector('[data-mverr="'+pid+'"]');
    var k=$("mk_"+pid).value==="draw"?"draw":"repay";
    var a=num($("ma_"+pid).value),dt=$("md_"+pid).value;
    function bad(m){if(err){err.textContent=m;err.hidden=false;}return true;}
    if(err)err.hidden=true;
    if(isNaN(a)&&bad(t("eAmtNotNumber")))return;
    if(!(a>0)&&bad(t("eAmount")))return;
    if(!validDate(dt)&&bad(t("eDate")))return;
    if(P(dt)<P(it.start)&&bad(t("eBeforeLent")))return;
    if(P(dt)>NOW&&bad(t("eFuture")))return;
    if(k==="repay"&&it.type==="stloan"){
      var W=stWalk(it,P(dt).getFullYear()),owed=stBalanceAt(it,P(dt));
      /* a payoff usually covers the arrears too; tick those off rather than refusing */
      if(a>owed+0.5){
        if(a<=W.held+0.5){
          W.rows.forEach(function(row){if(!row.paid&&P(row.due)<=P(dt)){it.paid=it.paid||{};it.paid[row.due]=dt;}});
          a=Math.min(a,stBalanceAt(it,P(dt)));
        } else if(bad(t("eMoreThanOwed",{v:money(W.held)})))return;
      }
    }
    it.moves=it.moves||[];
    it.moves.push({id:uid(),date:dt,amt:a,kind:k});
    it.moves.sort(function(x,y){return x.date<y.date?-1:1;});
    save();render();};});

  each("[data-collect]",function(b){b.onclick=function(){
    var it=find(b.getAttribute("data-collect"));if(!it)return;
    var err=document.querySelector('[data-gerr="'+it.id+'"]');
    if(err)err.hidden=true;
    function bad(m){if(err){err.textContent=m;err.hidden=false;}return true;}
    var v=num($("rc_"+it.id).value),dt=$("rd_"+it.id).value;
    if(isNaN(v)&&bad(t("eAmtNotNumber")))return;
    if(!(v>0)&&bad("Enter an amount."))return;
    if(!validDate(dt)&&bad(t("eDate")))return;
    if(!Array.isArray(it.gots))it.gots=((+it.got>0)?[{id:uid(),date:it.start,amt:+it.got}]:[]);
    delete it.got;
    var total=leaseGot(it)+v,earnedAll=(+it.rent||0)*(it.end?sliceInYear(it.start,it.end,P(it.end).getFullYear())+sliceInYear(it.start,it.end,P(it.start).getFullYear())*0:sliceInYear(it.start,"",NOW.getFullYear()));
    var lifetime=(+it.rent||0)*(it.end?months(P(it.start),new Date(P(it.end).getFullYear(),P(it.end).getMonth(),P(it.end).getDate()+1)):months(P(it.start),NOW));
    if(total>lifetime+0.5&&bad(t("eOverRent",{a:money(total),b:money(lifetime)})))return;
    it.gots.push({id:uid(),date:dt,amt:v});
    save();render();};});
  each("[data-delgot]",function(b){b.onclick=function(){
    var it=find(b.getAttribute("data-on")),gid=b.getAttribute("data-delgot");if(!it)return;
    if(!Array.isArray(it.gots))it.gots=((+it.got>0)?[{id:"legacy",date:it.start,amt:+it.got}]:[]);
    delete it.got;
    var g=it.gots.filter(function(x){return x.id===gid;})[0],idx=it.gots.indexOf(g);
    it.gots=it.gots.filter(function(x){return x.id!==gid;});save();
    if(g)setUndo(t("undoRemovedRent",{v:money(+g.amt||0)}),function(){it.gots.splice(idx,0,g);save();});
    render();};});

  each("[data-close]",function(b){b.onclick=function(){
    var it=find(b.getAttribute("data-close"));if(!it)return;
    var err=document.querySelector('[data-cerr="'+it.id+'"]');
    if(err)err.hidden=true;
    function bad(m){if(err){err.textContent=m;err.hidden=false;}return true;}
    var v=num($("cs_"+it.id).value),dt=$("cd_"+it.id).value;
    if(isNaN(v)&&bad(t("eAmtNotNumber")))return;
    if(!(v>0)&&bad(t("eSoldFor")))return;
    if(!validDate(dt)&&bad(t("eDate")))return;
    if(P(dt)>NOW&&bad(t("eFuture")))return;
    if(it.bought&&P(dt)<P(it.bought)&&bad(t("eSellAfter")))return;
    var prevRev=it.revenue,prevSold=it.sold;
    it.revenue=v;it.sold=dt;save();
    setUndo(t("undoSold",{n:it.name,v:money(v)}),function(){
      it.revenue=prevRev;it.sold=prevSold;save();});
    render();};});
  if($("addToggle"))$("addToggle").onclick=function(){addOpen=!addOpen;editing=null;render();};
  if($("addgo")||document.querySelector("[data-addgo]"))each("[data-addgo]",function(b){b.onclick=function(){
    var t=VIEW,o=readForm(t,"fl_"),err=$("fl_err"),msg=validate(t,o);
    if(msg){err.textContent=msg;err.hidden=false;return;}
    o.id=uid();o.type=t;
    if(t==="ltloan"||t==="stloan"){o.moves=[];o.paid={};}
    if(t==="lease")o.got=0;
    S.items.push(o);addOpen=false;flash="";save();render();};});

  if($("q"))$("q").oninput=function(){q=$("q").value;
    var pos=$("q").selectionStart;render();
    var el=$("q");if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(e){}}};
  if($("fxJump"))$("fxJump").onclick=function(){menuOpen=true;showFx();};
  if($("undoBtn"))$("undoBtn").onclick=function(){
    if(undo&&undo.fn)undo.fn();undo=null;if(setUndo.t)clearTimeout(setUndo.t);render();};
}

function showFx(pending){
  var h=(S.fx||[]).slice().sort(function(a,b){return a.date<b.date?-1:1;}).reverse();
  var last=fxLatest();
  var body='<div class="panel"><p class="hint" style="margin:0 0 4px"><b>'+esc(t("fxTitle"))+'</b></p>'+
    '<p class="hint" style="margin:0 0 12px">'+esc(t("fxSub"))+'</p>';
  if(pending){
    var prev=last?(" \u00b7 "+t("fxChange",{p:Math.abs((pending.rate/last.rate-1)*100).toFixed(1),
      dir:(pending.rate>last.rate)?t("weaker"):t("stronger"),d:last.date})):"";
    body+='<p class="hint" style="margin:0 0 12px">'+esc(t("fxConfirm",{v:fmt(pending.rate)+" "+S.cur+"/"+(S.fxRef||"USD")}))+esc(prev)+'</p>'+
      '<div class="ctl"><button class="chip" id="fxYes" aria-pressed="true">'+esc(t("fxYes"))+'</button>'+
      '<button class="chip" id="fxNo">'+esc(t("fxNo"))+'</button></div>';
  } else {
    body+='<div class="grid">'+
      '<div><label for="fxRate">'+esc(t("fxLabel",{c:S.fxRef||"USD",m:S.cur}))+'</label>'+
        '<input id="fxRate" type="text" inputmode="decimal" autocomplete="off" value="'+(last?esc(last.rate):"")+'"></div>'+
      '<div><label for="fxRef">'+esc(t("fxAgainst"))+'</label><select class="fld" id="fxRef">'+
        ["USD","THB","SGD","CNY","CAD"].map(function(c){return '<option value="'+c+'"'+((S.fxRef||"USD")===c?" selected":"")+'>'+c+'</option>';}).join("")+
        '</select></div>'+
      '<div><label for="fxDate">'+esc(t("date"))+'</label><input id="fxDate" type="date" value="'+esc(isoOf(NOW))+'"></div>'+
      '<button class="solid wide" id="fxGo">'+esc(t("fxSave"))+'</button></div>'+
      '<p class="err" id="fxErr" hidden></p>';
  }
  body+='<p class="subhead">'+esc(t("fxHistory"))+'</p>';
  if(!h.length)body+='<p class="hint" style="margin:0">'+esc(t("fxNone"))+'</p>';
  else body+=h.slice(0,8).map(function(x,i){
    var nxt=h[i+1],ch=nxt?((x.rate/nxt.rate-1)*100):null;
    return '<div class="fxrow"><span class="d">'+esc(x.date)+'</span>'+
      '<span class="r">'+esc(fmt(x.rate))+' '+esc(S.cur+"/"+(x.ref||S.fxRef||"USD"))+'</span>'+
      (ch!==null?'<span class="c '+(ch>0?"up":"dn")+'">'+(ch>0?"+":"")+ch.toFixed(1)+'%</span>':'')+
      '<button class="x" data-delfx="'+esc(x.id)+'">\u00d7</button></div>';}).join("");
  body+='<div class="ctl" style="margin-top:12px"><button class="chip" id="fxDone">'+esc(t("done"))+'</button></div></div>';
  $("menuSlot").innerHTML=body;
  if(pending){
    $("fxYes").onclick=function(){
      S.fx=S.fx||[];
      S.fx=S.fx.filter(function(x){return x.date!==pending.date;});
      S.fx.push({id:uid(),date:pending.date,rate:pending.rate,ref:pending.ref});
      S.fxRef=pending.ref;
      var first=(S.fx.length===1);
      save();showFx();
      if(first)flash=t("fxFirst");
      render();showFx();
    };
    $("fxNo").onclick=function(){showFx();};
  } else {
    $("fxGo").onclick=function(){
      var err=$("fxErr");err.hidden=true;
      var v=num($("fxRate").value),d=$("fxDate").value,ref=$("fxRef").value;
      if(isNaN(v)||!(v>0)){err.textContent=t("eAmtNotNumber");err.hidden=false;return;}
      if(!validDate(d)){err.textContent=t("eDate");err.hidden=false;return;}
      showFx({rate:v,date:d,ref:ref});
    };
  }
  each("[data-delfx]",function(b){b.onclick=function(){
    var id=b.getAttribute("data-delfx");
    S.fx=(S.fx||[]).filter(function(x){return x.id!==id;});save();render();showFx();};});
  $("fxDone").onclick=function(){menuOpen=false;$("menuSlot").innerHTML="";render();};

  $("csvBtn").onclick=function(){offer("iwp-"+S.year+".csv",csvBlob(S.year),"text/csv",false);};
};
/* some viewers block a page from saving a file; always show the text too,
   so the data can be copied out whatever the surroundings allow */
function offer(name,text,mime,isBackup){
  var saved=false;
  try{
    var blob=new Blob([text],{type:mime}),a=document.createElement("a");
    if("download" in a){
      a.href=URL.createObjectURL(blob);a.download=name;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(a.href);},1500);saved=true;
    }
  }catch(e){}
  if(isBackup){S.backupAt=Date.now();save();}
  $("menuSlot").innerHTML='<div class="panel">'+
    '<p class="hint" style="margin:0 0 10px">'+(saved?t("savedAs",{n:esc(name)}):"")+
      t("noFileHint",{n:esc(name)})+'</p>'+
    '<textarea class="datout" id="datout" readonly>'+esc(text)+'</textarea>'+
    '<div class="ctl" style="margin-top:10px">'+
      '<button class="chip" id="copyBtn">'+esc(t("copyClip"))+'</button>'+
      '<button class="chip" id="doneBtn">'+esc(t("done"))+'</button></div></div>';
  var ta=$("datout");
  $("copyBtn").onclick=function(){
    var btn=$("copyBtn");
    function fallback(){try{ta.focus();ta.select();btn.textContent=t("selectCopy");}catch(e){}}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){btn.textContent=t("copied");},fallback);
    }else fallback();
  };
  $("doneBtn").onclick=function(){menuOpen=false;$("menuSlot").innerHTML="";render();releaseHold();};
}
function ingest(d){
  if(d&&d.format==="iwp"&&Array.isArray(d.items)){
    var before=S.items.slice(),n=restoreFrom(d);
    flash=t("restored",{n:n});
    setUndo(t("restored",{n:n}).replace(/<[^>]+>/g,""),function(){S.items=before;save();});
  } else {
    var res=importLedger(d);
    if(!res.count&&!res.dupes){flash=t("noLoans");VIEW="home";render();return;}
    if(!res.count&&res.dupes){
      flash=t("nothingNew",{n:res.dupes});
      VIEW="home";menuOpen=false;$("menuSlot").innerHTML="";render();return;}
    var prev=S.items.slice();
    S.items=S.items.concat(res.items);
    flash=t("imported",{n:res.count})+(res.dupes?t("skippedDup",{n:res.dupes}):"");
    setUndo(t("imported",{n:res.count}).replace(/<[^>]+>/g,""),function(){S.items=prev;save();});
  }
  VIEW="home";menuOpen=false;$("menuSlot").innerHTML="";save();render();
}
$("impFile").onchange=function(e){
  var f=e.target.files[0];e.target.value="";if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{d=JSON.parse(rd.result);}
    catch(err){flash=t("badFile");VIEW="home";render();return;}
    ingest(d);
  };
  rd.onerror=function(){flash=t("unreadable");VIEW="home";render();};
  rd.readAsText(f);
};


/* =======================================================================
   SYNC  —  the phone is the source of truth, the cloud is a backup and a
   messenger. The app always draws from the device copy; Firebase only
   carries changes between devices. Any of it can be down and the book
   still opens and still saves.

   Layout:  users/{uid}/iwp_chunks/{core|graves|ltloan|stloan|lease|cycle}
   Chunked so that editing one loan rewrites one small document, never the
   whole book, which keeps writes tiny and stays under the 1 MB doc limit.
   ======================================================================= */
var FB=null;                      /* this install's Firebase settings */
try{FB=JSON.parse(localStorage.getItem(FBKEY)||"null");}catch(e){FB=null;}
var SY={ready:false,user:null,busy:false,at:0,err:"",asking:null,hold:false,live:[],
        sentTo:"",linking:false,askEmail:false,pasteLink:null};
var LASTUP={};                    /* chunk -> what we last wrote, so we skip no-ops */
var CH=["ltloan","stloan","lease","cycle"];
var fb=null,fsdb=null,fsauth=null,pushTimer=null;

function fbOK(){return !!(FB&&FB.apiKey&&FB.projectId&&FB.appId);}
function syncOn(){return !!(SY.ready&&SY.user);}

/* The SDK loads from plain <script defer> tags in the head, so by the time
   boot finishes it is usually already there. We only wait for it. If it never
   arrives the app carries on exactly as before — local only. */
function loadFB(cb){
  var t0=Date.now();
  (function wait(){
    if(window.firebase&&window.firebase.firestore)return cb(true);
    if(Date.now()-t0>10000)return cb(false);
    setTimeout(wait,120);
  })();
}
function lastEmail(){try{return localStorage.getItem(MAILKEY)||"";}catch(e){return "";}}
/* Completing a sign-in link. The address is remembered on the device that
   asked for it; opening the link on a second device has nothing remembered,
   so that device asks for the address rather than failing. */
function finishLink(em,onErr,link){
  var fromUrl=!link;
  SY.linking=true;SY.askEmail=false;if(menuOpen)showSync();
  fsauth.signInWithEmailLink(em,link||location.href).then(function(){
    try{localStorage.setItem(MAILKEY,em);}catch(x){}
    SY.linking=false;SY.askEmail=false;SY.sentTo="";
    if(fromUrl){try{history.replaceState({},"",location.href.split("?")[0].split("#")[0]);}catch(x){}}
    menuOpen=false;if($("menuSlot"))$("menuSlot").innerHTML="";
    flash=t("syncHello");render();
  },function(err){
    SY.linking=false;SY.askEmail=true;
    var m=String(err&&err.message||err);
    if(onErr)onErr(m);else{SY.err=m;if(menuOpen)showSync();}
  });
}
function checkLink(){
  if(!SY.ready)return;
  var isLink=false;
  try{isLink=fsauth.isSignInWithEmailLink(location.href);}catch(e){}
  if(!isLink)return;
  var em=lastEmail();
  if(em)finishLink(em);
  else{SY.askEmail=true;showSync();}
}
function syncBoot(cb){
  cb=cb||function(){};
  if(!fbOK())return cb(false);
  loadFB(function(ok){
    if(!ok){SY.err=t("syncNoNet");paintSync();return cb(false);}
    try{
      if(!fb)fb=firebase.apps.length?firebase.app():firebase.initializeApp(FB);
      fsauth=firebase.auth();fsdb=firebase.firestore();
      SY.ready=true;
      fsauth.onAuthStateChanged(function(u){
        SY.user=u?{uid:u.uid,email:u.email}:null;
        stopLive();
        if(u)firstContact();
        paintSync();
      });
      checkLink();
      cb(true);
    }catch(e){SY.err=String(e&&e.message||e);paintSync();cb(false);}
  });
}

/* ---------- reading and writing the chunks ---------- */
function chunkRef(name){return fsdb.collection("users").doc(SY.user.uid).collection("iwp_chunks").doc(name);}
function packChunk(name){
  if(name==="core")return {data:coreOf(),rev:S.rev.core||0};
  if(name==="graves")return {dead:S.dead||{}};
  var recs={},rev={};
  S.items.forEach(function(it){
    if(it.type!==name)return;
    recs[it.id]=it;rev[it.id]=S.rev[it.id]||0;
  });
  return {recs:recs,rev:rev};
}
function pullAll(){
  var names=["core","graves"].concat(CH);
  return Promise.all(names.map(function(n){
    return chunkRef(n).get().then(function(d){return {n:n,v:d.exists?d.data():null};},
                                  function(){return {n:n,v:null};});
  })).then(function(rows){
    var out={core:null,graves:null,mods:{}},any=false;
    rows.forEach(function(r){
      if(!r.v)return;
      any=true;
      if(r.n==="core")out.core=r.v;
      else if(r.n==="graves")out.graves=r.v;
      else out.mods[r.n]=r.v;
    });
    out.any=any;
    return out;
  });
}

/* ---------- the merge: per record, newest wins ---------- */
function mergeCloud(cloud){
  var localBy={};S.items.forEach(function(it){localBy[it.id]=it;});
  var cloudBy={},cloudRev={};
  Object.keys(cloud.mods||{}).forEach(function(ty){
    var c=cloud.mods[ty]||{},recs=c.recs||{},rv=c.rev||{};
    Object.keys(recs).forEach(function(id){cloudBy[id]=recs[id];cloudRev[id]=rv[id]||0;});
  });
  var cloudDead=(cloud.graves&&cloud.graves.dead)||{};
  var ids={};
  [localBy,cloudBy,S.dead,cloudDead].forEach(function(m){Object.keys(m||{}).forEach(function(k){ids[k]=1;});});

  var keep=[],rev={},dead={},changed=false;
  Object.keys(ids).forEach(function(id){
    var lr=S.rev[id]||0,ld=S.dead[id]||0,cr=cloudRev[id]||0,cd=cloudDead[id]||0;
    var lt=Math.max(lr,ld),ct=Math.max(cr,cd),useCloud;
    if(ct!==lt)useCloud=ct>lt;
    else useCloud=ct>0?true:!localBy[id];   /* a tie goes to the cloud so every device agrees */
    var wasDeleted=(ld>=lr&&ld>0),willDelete;
    if(useCloud){
      willDelete=(cd>=cr&&cd>0);
      if(willDelete)dead[id]=cd;
      else if(cloudBy[id]){keep.push(cloudBy[id]);rev[id]=cr;}
      if(!willDelete&&cloudBy[id]&&sig(cloudBy[id])!==sig(localBy[id]))changed=true;
      if(willDelete&&localBy[id])changed=true;
    }else{
      if(wasDeleted)dead[id]=ld;
      else if(localBy[id]){keep.push(localBy[id]);rev[id]=lr;}
    }
  });
  /* settings move as one record */
  var cRev=(cloud.core&&cloud.core.rev)||0,lRev=S.rev.core||0;
  if(cloud.core&&cloud.core.data&&cRev>=lRev&&cRev>0){
    var d=cloud.core.data;
    if(d.cur)S.cur=d.cur;
    if(d.lang)S.lang=d.lang;
    if(Array.isArray(d.fx))S.fx=d.fx;
    if(d.fxRef)S.fxRef=d.fxRef;
    if(typeof d.blur==="boolean")S.blur=d.blur;
    rev.core=cRev;
    if(sig(d)!==sig(coreOf()))changed=true;
  }else rev.core=lRev;

  S.items=keep;S.rev=rev;S.dead=dead;
  return changed;
}

/* ---------- pushing: only the chunks that actually differ ---------- */
function syncPush(){
  if(!syncOn())return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(doPush,700);          /* let a burst of edits settle */
}
function doPush(){
  if(!syncOn())return;
  var names=["core","graves"].concat(CH),writes=[];
  names.forEach(function(n){
    var body=packChunk(n),g=sig(body);
    if(LASTUP[n]===g)return;                 /* nothing differs: write nothing */
    LASTUP[n]=g;
    writes.push(chunkRef(n).set(body));
  });
  if(!writes.length)return;
  SY.busy=true;paintSync();
  Promise.all(writes).then(function(){
    SY.busy=false;SY.at=Date.now();SY.err="";paintSync();
  },function(e){
    SY.busy=false;SY.err=String(e&&e.message||e);paintSync();
  });
}

/* ---------- live updates from the other devices ---------- */
function stopLive(){SY.live.forEach(function(u){try{u();}catch(e){}});SY.live=[];}
function startLive(){
  if(!syncOn())return;
  stopLive();
  ["core","graves"].concat(CH).forEach(function(n){
    SY.live.push(chunkRef(n).onSnapshot(function(){incoming();},function(){}));
  });
}
var pendingIncoming=false;
function incoming(){
  if(!syncOn())return;
  /* never redraw under someone's hands: a sheet open means wait */
  if(SY.hold||menuOpen||addOpen||editing){pendingIncoming=true;return;}
  pendingIncoming=false;
  pullAll().then(function(cloud){
    if(!cloud.any)return;
    var changed=mergeCloud(cloud);
    seedSeen(0);
    var j;try{j=JSON.stringify(S);}catch(e){return;}
    try{localStorage.setItem(KEY,j);}catch(e){}
    idbPut(KEY,j);
    SY.at=Date.now();
    if(changed)render();else paintSync();
    doPush();                                 /* hand back anything only we had */
  },function(e){SY.err=String(e&&e.message||e);paintSync();});
}
function releaseHold(){if(pendingIncoming)setTimeout(incoming,80);}

/* ---------- first contact: a device with data meets an account with other data ---------- */
function firstContact(){
  if(!syncOn())return;
  pullAll().then(function(cloud){
    var cloudCount=0;
    Object.keys(cloud.mods||{}).forEach(function(ty){cloudCount+=Object.keys((cloud.mods[ty]||{}).recs||{}).length;});
    var mine=S.items.length;
    if(!cloud.any||cloudCount===0){          /* empty account: this device seeds it */
      LASTUP={};doPush();startLive();return;
    }
    if(mine===0){                             /* empty device: take the account's copy */
      mergeCloud(cloud);seedSeen(0);
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      idbPut(KEY,JSON.stringify(S));
      LASTUP={};startLive();render();return;
    }
    /* both sides hold a book. Never guess — ask, and keep a copy of the loser. */
    SY.asking={cloud:cloud,cloudCount:cloudCount,mine:mine};
    paintSync();
  },function(e){SY.err=String(e&&e.message||e);paintSync();});
}
function answerFirst(which){
  var a=SY.asking;if(!a)return;
  var before=backupBlob();
  SY.asking=null;
  if(which==="cloud"){
    S.items=[];S.rev={};S.dead={};
    mergeCloud(a.cloud);
  }else{
    /* keep this device: bury everything the account holds that we do not */
    var now=Date.now();
    Object.keys(a.cloud.mods||{}).forEach(function(ty){
      var recs=(a.cloud.mods[ty]||{}).recs||{};
      Object.keys(recs).forEach(function(id){
        if(!S.items.some(function(it){return it.id===id;}))S.dead[id]=now;
      });
    });
    S.items.forEach(function(it){S.rev[it.id]=now;});
    S.rev.core=now;
  }
  seedSeen(0);
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  idbPut(KEY,JSON.stringify(S));
  LASTUP={};doPush();startLive();
  flash=t("syncReplaced");
  render();
  /* the copy that lost is handed back as a file, never silently dropped */
  setTimeout(function(){offer("iwp-before-sync-"+isoOf(new Date())+".json",before,"application/json",false);},40);
}

}

/* ---------- boot ---------- */
function boot(){
  var went=false;
  var go=function(mirror){
    if(went)return;went=true;
    /* localStorage can be cleared by the phone while IndexedDB survives */
    if((!S.items||!S.items.length)&&mirror){
      try{var m=JSON.parse(mirror);if(m&&Array.isArray(m.items)&&m.items.length)S=Object.assign(S,m);}catch(e){}
      if(!S.rev)S.rev={};if(!S.dead)S.dead={};
    }
    /* Earlier versions kept holdings and loose cash entries. This book follows
       cash from lending, trading and leasing only, so anything else is set
       aside rather than loaded; it stays in any backup file already saved. */
